# Controls only the library's own tests use, beside spec/fixtures/controls-patterns.yaml.
schema_version: 1
controls:
  - id: test-0001
    name: A short deadline, so real timers act within a test
    flavor: human-system-authorization
    human_config:
      pattern: action-approval
      subject_kind: action
      routing: { roles: [ai-system-owner] }
      accountable_owner: ai-system-owner
      sla_target: PT3S

  - id: test-0002
    name: A halt-restart control with a minimum review time
    flavor: human-halt
    human_config:
      pattern: halt-restart
      subject_kind: system
      routing: { roles: [safety-officer] }
      accountable_owner: safety-officer
      sla_target: PT1H
      minimum_review_seconds: 30
    halt_config:
      scope: capability
      target: review-time-capability
      exerciser_personae: [safety-officer]
      exercise_endpoint: "POST /oversight/halts"
      affected_calls: all-runtime-operations
      emits_on_exercise: HaltExercised
      emits_on_lift: HaltLifted

  - id: test-0003
    name: Account numbers are masked in what a reviewer is shown
    flavor: sanitizer-pii
    sanitizer_config:
      data_classes: [financial]
      injection_point: before-human-display
      redaction_strategy: mask
