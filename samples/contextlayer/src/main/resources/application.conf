akka.javasdk {
  dev-mode.http-port = 9165
  dev-mode.service-name = "contextlayer"

  # Every library component the service uses, including the ones a listed component calls.
  library.components {
    event-sourced-entity = [
      "io.akka.human.akka.HumanEventEntity",
      "io.akka.human.local.ProofLedgerEntity"
    ]
    key-value-entity = ["io.akka.human.akka.HaltEntity", "io.akka.human.akka.StandingDecisionsEntity"]
    view = ["io.akka.human.akka.HumanEventsView"]
    consumer = ["io.akka.human.akka.HumanDeadlines", "io.akka.human.akka.HumanOutcomes"]
    timed-action = ["io.akka.human.akka.HumanDeadlineAction"]
    http-endpoint = ["io.akka.human.akka.OversightEndpoint"]
  }
}

# The library settings this service reads in its setup: the environment selects each control's
# strength; the development routes serve /oversight/dev/* and are never on in production.
human {
  environment = "local"
  dev-routes = true
  # Write $AKKA_HUMAN_HOME/services/contextlayer.json on startup, for the companion.
  register = true
}
