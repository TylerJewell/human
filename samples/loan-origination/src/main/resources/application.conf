akka.javasdk {
  dev-mode.http-port = 9166
  # The local runtime name; ai-console's own loan-origination service (9089) uses the plain name. The
  # oversight service name, in events and the companion's registration file, stays loan-origination.
  dev-mode.service-name = "human-loan-origination"

  # Every library component the service uses, including the ones a listed component calls.
  library.components {
    event-sourced-entity = [
      "io.akka.human.akka.HumanEventEntity",
      "io.akka.human.local.ProofLedgerEntity"
    ]
    key-value-entity = [
      "io.akka.human.akka.HaltEntity",
      "io.akka.human.akka.StandingDecisionsEntity"
    ]
    view = ["io.akka.human.akka.HumanEventsView"]
    consumer = ["io.akka.human.akka.HumanDeadlines", "io.akka.human.akka.HumanOutcomes"]
    timed-action = ["io.akka.human.akka.HumanDeadlineAction"]
    http-endpoint = ["io.akka.human.akka.OversightEndpoint"]
  }
}

# The library settings this service reads in its setup: every event is raised in pre-production, as
# the demonstration's were, so each control's pre-production strength applies; the development
# routes serve /oversight/dev/* and are never on in production.
human {
  environment = "pre-production"
  dev-routes = true
  # Write $AKKA_HUMAN_HOME/services/loan-origination.json on startup, for the companion.
  register = true
}

loan-origination {
  # How often the monitors of S2, S3 and S4 evaluate their triggers; 0s runs them only on request.
  monitors.interval = 1m
  # S2 measures the referral share once this many assessments fall in its window.
  monitors.referral-minimum = 20
  # A restart of the eligibility assessment needs at most this many applications waiting for an
  # underwriter.
  halt.max-referral-backlog = 5
}
