# The human controls of the Loan Origination assistant. Rows custom-5a1e00000001 to 07 are the
# scenarios S1 to S7 and 0ff1ce0001 is the template review, with the ids and names of the bundle in
# ai-console (samples/loan-origination/governance/controls.yaml). Rows 08 to 10 are the domain
# reviews that were plain workflow pauses there: held notices, underwriting review, contests.
#
# Each human_config is a Verify v2.8 human_config (spec/verify/human-config.schema.json); a setting
# left out takes the pattern's default, then the shared default (spec/verify/human-patterns.yaml).
# Escalation queues carry the roles the bundle's draft config could not express.
schema_version: 1
service: loan-origination
controls:
  - id: custom-5a1e00000001
    name: Deadline extensions beyond policy need the system owner
    flavor: human-system-authorization
    human_config:
      pattern: action-approval
      subject_kind: action
      trigger: { detector: tool-policy, condition: "extendDocumentDeadline.days > 14" }
      routing: { roles: [loan-system-owner], review_mode: SINGLE, required: 1, independence: [proposer] }
      accountable_owner: loan-system-owner
      sla_target: PT30M
      timeout_behaviour: RESUME_WITH_DEFAULT
      timeout_default: DENY
      escalation_chain:
        - { queue: system-owners, roles: [loan-system-owner] }
        - { queue: head-of-credit, roles: [head-of-credit], after: PT30M }
      allowed_actions: [APPROVE, DENY, EDIT, ESCALATE, REQUEST_MORE_INFO, DECLINE_SYSTEM]
      sticky_modes: [APPROVE_ONCE, APPROVE_FOR_PATTERN]
      rationale_required: true
      minimum_review_seconds: 20
      ai_recommendation: deadline-extension-judge
      strength: { pre-production: prevent, production: prevent }
      shadow: false

  - id: custom-5a1e00000002
    name: Referral rate drift is reviewed by the model risk owner
    flavor: human-monitoring
    human_config:
      pattern: triage
      subject_kind: behaviour
      trigger:
        detector: monitor
        condition: "referral-share < 20 over PT24H"
        metric: referral-share
        comparison: "<"
        threshold: 20
        window: PT24H
        baseline: 35
      routing: { roles: [model-risk-owner], review_mode: SINGLE, required: 1, independence: [] }
      accountable_owner: model-risk-owner
      sla_target: P1D
      timeout_behaviour: ESCALATE
      escalation_chain:
        - { queue: model-risk, roles: [model-risk-owner] }
        - { queue: head-of-credit, roles: [head-of-credit], after: P1D }
      allowed_actions: [APPROVE, ESCALATE, HALT, REQUEST_MORE_INFO]
      rationale_required: true
      minimum_review_seconds: 20
      strength: { pre-production: warn, production: warn }
      shadow: false

  # The figure is the share of the underwriting review's decisions made under its minimum review
  # time (custom-5a1e00000009: 8 seconds, recorded rather than refused).
  - id: custom-5a1e00000003
    name: Rushed underwriting reviews go to the risk officer
    flavor: human-monitoring
    human_config:
      pattern: oversight-quality
      subject_kind: behaviour
      trigger:
        detector: monitor
        condition: "below-minimum-share > 0.1 over P7D"
        metric: below-minimum-share
        comparison: ">"
        threshold: 0.1
        window: P7D
      routing: { roles: [risk-officer], review_mode: SINGLE, required: 1, independence: [] }
      accountable_owner: risk-officer
      sla_target: P2D
      timeout_behaviour: ESCALATE
      escalation_chain:
        - { queue: risk-officers, roles: [risk-officer] }
        - { queue: head-of-credit, roles: [head-of-credit], after: P2D }
      allowed_actions: [APPROVE, EDIT, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 20
      strength: { pre-production: warn, production: warn }
      shadow: false

  - id: custom-5a1e00000004
    name: Bursts of protected-characteristics blocks go to compliance
    flavor: human-monitoring
    human_config:
      pattern: triage
      subject_kind: behaviour
      trigger:
        detector: monitor
        condition: "protected-characteristics-blocks > 5 over PT1H"
        metric: protected-characteristics-blocks
        comparison: ">"
        threshold: 5
        window: PT1H
      routing: { roles: [compliance-lead], review_mode: SINGLE, required: 1, independence: [] }
      accountable_owner: compliance-lead
      sla_target: PT1H
      timeout_behaviour: ESCALATE
      escalation_chain:
        - { queue: compliance, roles: [compliance-lead] }
        - { queue: head-of-credit, roles: [head-of-credit], after: PT1H }
      allowed_actions: [APPROVE, ESCALATE, REQUEST_MORE_INFO]
      rationale_required: true
      minimum_review_seconds: 20
      strength: { pre-production: warn, production: warn }
      shadow: false

  - id: custom-5a1e00000005
    name: Model changes to adverse-action notices need two approvals
    flavor: human-system-authorization
    human_config:
      pattern: change-authorization
      subject_kind: change
      trigger: { detector: change-request, condition: "a rollout of the notice writer awaits approval" }
      routing:
        roles: [ai-system-owner, compliance-lead]
        review_mode: TWO_PERSON
        required: 2
        independence: [proposer, builder]
      accountable_owner: ai-system-owner
      sla_target: P2D
      timeout_behaviour: RESUME_WITH_DEFAULT
      timeout_default: DENY
      escalation_chain:
        - { queue: ai-change-board, roles: [ai-system-owner, compliance-lead] }
      allowed_actions: [APPROVE, DENY, REQUEST_MORE_INFO, SEND_BACK]
      rationale_required: true
      minimum_review_seconds: 60
      strength: { pre-production: prevent, production: prevent }
      shadow: false

  # One officer halts at once; a restart needs two others while the safe-state checks pass.
  - id: custom-5a1e00000006
    name: Automated eligibility assessment can be halted
    flavor: human-halt
    human_config:
      pattern: halt-restart
      subject_kind: system
      trigger: { detector: person, condition: "an officer asks to halt or resume the automated assessment" }
      routing:
        roles: [oversight-officer, safety-officer]
        review_mode: TWO_PERSON
        required: 2
        independence: [proposer]
      accountable_owner: oversight-officer
      sla_target: PT4H
      timeout_behaviour: RESUME_WITH_DEFAULT
      timeout_default: DENY
      escalation_chain:
        - { queue: oversight-officers, roles: [oversight-officer, safety-officer] }
      allowed_actions: [HALT, APPROVE, DENY]
      rationale_required: true
      strength: { pre-production: prevent, production: prevent }
      shadow: false
    halt_config:
      scope: capability
      target: eligibility-assessment
      exerciser_personae: [oversight-officer, safety-officer]
      exercise_endpoint: "POST /oversight/halts"
      affected_calls: all-runtime-operations
      emits_on_exercise: HaltExercised
      emits_on_lift: HaltLifted
      safe_state_definition: No automated assessment runs; every application whose documents are in goes to an underwriter.

  - id: custom-5a1e00000007
    name: Flagged support replies are triaged
    flavor: human-feedback
    human_config:
      pattern: flag-feedback
      subject_kind: output
      trigger: { detector: person, condition: "a person flags a support assistant reply" }
      routing: { roles: [ai-system-owner], review_mode: SINGLE, required: 1, independence: [] }
      sla_target: P5D
      timeout_behaviour: ABANDON
      escalation_chain:
        - { queue: feedback-triage, roles: [ai-system-owner] }
        - { queue: compliance, roles: [compliance-lead], after: P5D }
      allowed_actions: [APPROVE, DENY, ESCALATE]
      rationale_required: true
      minimum_review_seconds: 0
      strength: { pre-production: warn, production: warn }
      shadow: false

  # A suggested template is a change to every notice for its decline reason, not a decision about
  # one person, so it is authorised as a change before it is used.
  - id: "0ff1ce0001"
    name: Adverse-action letter template review
    flavor: human-system-authorization
    human_config:
      pattern: change-authorization
      subject_kind: change
      trigger: { detector: change-request, condition: "an AI-suggested decline letter template" }
      routing: { roles: [underwriting-counsel] }
      accountable_owner: underwriting-counsel
      sla_target: P3D
      timeout_behaviour: RAISE_TIMEOUT
      escalation_chain:
        - { queue: template-review, roles: [underwriting-counsel] }
      strength: { pre-production: prevent, production: prevent }

  - id: custom-5a1e00000008
    name: Held adverse-action notices are released by a reviewer
    flavor: human-domain-decision
    human_config:
      pattern: decision-review
      subject_kind: output
      trigger: { detector: guardrail, condition: "notice-checker verdict = fail" }
      routing: { roles: [adverse-action-reviewer] }
      accountable_owner: compliance-lead
      sla_target: PT4H
      timeout_behaviour: RESUME_WITH_DEFAULT
      timeout_default: DENY
      escalation_chain:
        - { queue: held-notices, roles: [adverse-action-reviewer] }
      allowed_actions: [APPROVE, EDIT, DENY]
      strength: { pre-production: prevent, production: prevent }

  # Decisions under the minimum review time are recorded with a warning, so that
  # custom-5a1e00000003 can see rushed reviews.
  - id: custom-5a1e00000009
    name: Referred applications are decided by an underwriter
    flavor: human-domain-decision
    human_config:
      pattern: decision-review
      subject_kind: output
      trigger: { detector: workflow, condition: "the assessment did not approve the application on its own" }
      routing: { roles: [underwriter] }
      accountable_owner: head-of-credit
      sla_target: P2D
      timeout_behaviour: ESCALATE
      escalation_chain:
        - { queue: standard-review, roles: [underwriter] }
        - { queue: senior-review, roles: [senior-underwriter], after: P3D }
      allowed_actions: [APPROVE, DENY, REQUEST_MORE_INFO, ESCALATE]
      minimum_review_seconds: 8
      minimum_review: WARN
      ai_recommendation: eligibility-assessor
      strength: { pre-production: prevent, production: prevent }

  - id: custom-5a1e00000010
    name: Declined applicants can contest the decision
    flavor: human-domain-decision
    human_config:
      pattern: contest-appeal
      subject_kind: appeal
      trigger: { detector: person, condition: "a declined applicant contests within 30 days of the notice" }
      routing: { roles: [senior-underwriter] }
      accountable_owner: head-of-credit
      sla_target: P14D
      timeout_behaviour: ESCALATE
      escalation_chain:
        - { queue: contest-review, roles: [senior-underwriter] }
        - { queue: head-of-credit, roles: [head-of-credit], after: P7D }
      allowed_actions: [APPROVE, REVERSE, REQUEST_MORE_INFO]
      strength: { pre-production: prevent, production: prevent }
