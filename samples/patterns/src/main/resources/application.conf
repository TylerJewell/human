akka.javasdk {
  dev-mode.http-port = 9164
  dev-mode.service-name = "patterns"

  # Every library component the service uses, including the ones a listed component calls.
  library.components {
    event-sourced-entity = [
      "io.akka.human.akka.HumanEventEntity",
      "io.akka.human.local.ProofLedgerEntity",
      "io.akka.human.local.WorkflowInterventionsEntity"
    ]
    key-value-entity = [
      "io.akka.human.akka.HaltEntity",
      "io.akka.human.akka.StandingDecisionsEntity",
      "io.akka.human.local.ToolApprovalEntity"
    ]
    view = ["io.akka.human.akka.HumanEventsView"]
    consumer = ["io.akka.human.akka.HumanDeadlines", "io.akka.human.akka.HumanOutcomes"]
    timed-action = ["io.akka.human.akka.HumanDeadlineAction"]
    http-endpoint = ["io.akka.human.akka.OversightEndpoint"]
  }

  # Tool calls to pay need an action approval under pt-0001; while eligibility-assessment is halted,
  # the eligibility agent's tool and model calls are denied.
  agent.guardrails {
    "payment approval" {
      class = "io.akka.human.local.ApprovalGuardrail"
      agents = ["*"]
      tools = ["pay"]
      category = POLICY
      control = "pt-0001"
      match = "tool-arguments"
    }
    "eligibility halt (tools)" {
      class = "io.akka.human.local.HaltGuardrails$Tools"
      agents = ["*"]
      category = POLICY
      target = "eligibility-assessment"
    }
    "eligibility halt (model)" {
      class = "io.akka.human.local.HaltGuardrails$Model"
      agents = ["*"]
      category = POLICY
      target = "eligibility-assessment"
    }
  }
}

# The library settings this service reads in its setup: the environment selects each control's
# strength; the development routes serve /oversight/dev/* and are never on in production.
human {
  environment = "local"
  dev-routes = true
  # Write $AKKA_HUMAN_HOME/services/patterns.json on startup, for the companion.
  register = true
}
