# Canonical Human Decision Registry
#
# One vocabulary for every decision a person records on a human control, and
# the rule for what a human verdict concludes.
#
# A control lists the decisions it allows in `human_config.allowed_actions`;
# each oversight pattern (human-patterns.yaml) names the subset it uses and the
# label a reviewer sees. A label never changes what a decision means.
#
# Aliases are the names the same decision had elsewhere before this registry:
# the audit taxonomy (specs/corpus/aud-taxonomy.yaml), the scenario schema's
# human-action steps, and specs/platform/humans.md.
#
# Cross-reference: framework/schema/control.schema.yaml (human_config),
#   specs/decisions/adr-018-human-patterns.md
# Last updated: 2026-10-29

schema_version: "1.0"

actions:

  APPROVE:
    description: "The subject goes ahead as presented."
    aliases: [approve, hitl-approve]

  DENY:
    description: "The subject does not go ahead."
    aliases: [reject, hitl-reject]

  EDIT:
    description: "The subject goes ahead in a form the reviewer changed; the edit is recorded with the decision."
    aliases: [amend, modify]

  REDIRECT:
    description: "The work goes back to an agent or another route instead of the one proposed."
    aliases: []

  REPLAN:
    description: "The proposer is asked to plan the work again; nothing proceeds from this proposal."
    aliases: [retry]

  ESCALATE:
    description: "The decision moves to the next queue in the escalation chain."
    aliases: [escalate]

  HALT:
    description: "The system, service or capability named by the control's halt_config stops."
    aliases: [halt]

  RECUSE:
    description: "The reviewer steps aside; the event returns to the queue and the reviewer cannot claim it again."
    aliases: [recuse]

  REQUEST_MORE_INFO:
    description: "The reviewer asks for information before deciding; the event stays open."
    aliases: [defer]

  SEND_BACK:
    description: "The proposal returns to its proposer for changes, then comes back for review."
    aliases: [request-changes, changes-requested]

  DECLINE_SYSTEM:
    description: "A person takes the work over and finishes it outside the automated path."
    aliases: [take-over, manual-path]

  OVERRIDE:
    description: "After the output: a person replaces the system's output with their own."
    aliases: [override, hitl-override]

  DISREGARD:
    description: "After the output: a person sets the system's output aside without replacing it."
    aliases: [disregard, dismiss]

  REVERSE:
    description: "After the output: a person undoes the effect of a decision already applied."
    aliases: [reverse, overturn]

# Scopes a decision may extend to beyond its own event (specs/platform/humans.md §9.3).
sticky_modes:
  APPROVE_ONCE:
    description: "The decision applies to this event only. The default."
  APPROVE_FOR_SESSION:
    description: "The approval applies to matching events for the rest of the session."
  APPROVE_FOR_PATTERN:
    description: "The approval applies to future events that match a declared pattern, until revoked or re-confirmed."
  DENY_FOR_PATTERN:
    description: "The denial applies to future events that match a declared pattern, until revoked."

# What a human verdict concludes. A human verdict judges the oversight, not the
# AI's action: a reviewer who denies an unsafe action has made the control work.
verdict:
  upheld:
    description: "An authorised and qualified reviewer decided in time, with a rationale where required, after the minimum review time, with the votes the review mode requires. Holds whatever they decided."
  breached:
    description: "The oversight failed: a fail-open timeout, a decision without authority or qualification, a decision under the minimum review time, a missed deadline with no escalation, a late decision, or the two-person rule broken."
  inconclusive:
    description: "The event ended without a judgment: abandoned, withdrawn, or a fail-closed timeout."
  error:
    description: "The oversight could not run or finish: the event was killed, or the decision was never applied."

# Where a verdict came from. Only runtime verdicts count as evidence.
verdict_sources:
  runtime:
    description: "Recorded by a deployed system."
    counts_as_evidence: true
  simulated:
    description: "Generated by a scenario or seed, not by a system in use."
    counts_as_evidence: false
  rehearsal:
    description: "Recorded by a person practising decisions in a local or pre-production console."
    counts_as_evidence: false
